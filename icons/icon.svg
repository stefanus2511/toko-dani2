<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00652c" />
      <stop offset="100%" stop-color="#00471e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#79db8d" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Storefront and Shopping Bag Icon Motif -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Store Roof Awning -->
    <path d="M128 176 L384 176 L416 232 L96 232 Z" opacity="0.95"/>
    <!-- TD Monogram & Cart -->
    <text x="256" y="340" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-2">TD</text>
    <!-- Badge / Dot -->
    <circle cx="370" cy="180" r="28" fill="#fd6b36"/>
    <!-- Small Star or Icon inside badge -->
    <path d="M370 166 L373 176 L384 176 L375 182 L378 192 L370 186 L362 192 L365 182 L356 176 L367 176 Z" fill="#ffffff"/>
  </g>
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#d3ffd5" letter-spacing="4">TOKO DANI</text>
</svg>
