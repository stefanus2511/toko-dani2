<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta content="mobile_tab" name="shell-type" />
    <meta name="theme-color" content="#00652c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toko Dani" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Toko Dani · Kasir & Manajemen Toko</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Tailwind CSS & Mobile Optimized Configuration -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "green-badge-text": "#14532d",
              "cash-chip-active": "#166534",
              "error-container": "#ffdad6",
              "surface-sand": "#f5f1e9",
              secondary: "#ac3400",
              "on-error": "#ffffff",
              "tertiary-fixed": "#ffdbca",
              "text-primary-ink": "#292524",
              "on-tertiary-fixed": "#331200",
              "surface-container-high": "#f0e6e0",
              "border-warm": "#d6cec2",
              error: "#ba1a1a",
              "on-primary-fixed-variant": "#005323",
              "on-surface": "#1f1b17",
              "surface-cream": "#fbf9f5",
              background: "#fbf9f5",
              "text-muted-ink": "#57534e",
              "tertiary-container": "#b45309",
              primary: "#00652c",
              "green-badge-bg": "#dcfce7",
              "secondary-fixed-dim": "#ffb59d",
              "on-secondary-container": "#5d1900",
              "surface-container-warm": "#ede7dc",
              surface: "#fbf9f5",
              "surface-variant": "#eae1da",
              "on-tertiary-container": "#fff1eb",
              "on-tertiary-fixed-variant": "#763300",
              "on-tertiary": "#ffffff",
              "surface-container-low": "#f6f2ea",
              "outline-variant": "#e5ded4",
              "surface-container-lowest": "#ffffff",
              "primary-fixed-dim": "#79db8d",
              "on-error-container": "#93000a",
              "surface-container": "#f2ece2",
              "inverse-primary": "#79db8d",
              "border-warm-subtle": "#e8e2d8",
              "inverse-surface": "#342f2b",
              "secondary-fixed": "#ffdbd0",
              "danger-solid": "#dc2626",
              "on-secondary-fixed": "#390c00",
              "primary-container": "#15803d",
              "on-background": "#1f1b17",
              "surface-container-highest": "#eae1da",
              "tertiary-fixed-dim": "#ffb68e",
              "surface-dim": "#e2d8d2",
              "green-fresh-vibrant": "#16a34a",
              outline: "#8a8175",
              "danger-soft-bg": "#fee2e2",
              "on-primary-container": "#d3ffd5",
              "primary-fixed": "#95f8a7",
              "surface-tint": "#006d30",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#00210a",
              "inverse-on-surface": "#f9efe8",
              "on-surface-variant": "#696156",
              tertiary: "#903f00",
              "surface-bright": "#fbf9f5",
              "on-primary": "#ffffff",
              "secondary-container": "#fd6b36",
              "on-secondary-fixed-variant": "#832600",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "0.875rem",
              "space-xs": "0.375rem",
              "space-sm": "0.625rem",
              "space-md": "1rem",
              "space-lg": "1.25rem",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
            fontSize: {
              "display-price": [
                "26px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.02em",
                  fontWeight: "800",
                },
              ],
              "headline-lg": [
                "20px",
                {
                  lineHeight: "26px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "title-lg": ["17px", { lineHeight: "23px", fontWeight: "700" }],
              "title-md": ["15px", { lineHeight: "21px", fontWeight: "600" }],
              "body-lg": ["15px", { lineHeight: "22px", fontWeight: "500" }],
              "body-md": ["13.5px", { lineHeight: "19px", fontWeight: "400" }],
              "label-lg": ["14px", { lineHeight: "20px", fontWeight: "700" }],
              "label-md": ["13px", { lineHeight: "18px", fontWeight: "600" }],
              "label-sm": ["11.5px", { lineHeight: "16px", fontWeight: "600" }],
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://unpkg.com/@zxing/browser@latest"></script>
  </head>
  <body
    class="bg-surface text-on-surface flex flex-col min-h-screen antialiased select-none sm:select-auto font-sans text-body-md"
  >
    <!-- TOPBAR HEADER (Ukuran Pas & Proporsional Mobile: h-16, Max-W & Desktop Nav untuk Layar Komputer) -->
    <header
      class="fixed top-0 w-full z-50 pt-safe bg-surface/92 backdrop-blur-xl border-b border-border-warm-subtle/80 shadow-[0_1px_6px_rgba(41,37,36,0.03)]"
    >
      <div
        class="h-16 px-margin-mobile md:px-6 max-w-7xl mx-auto flex items-center justify-between"
      >
        <div class="flex items-center gap-2.5 min-w-0">
          <div
            class="w-8 h-8 rounded-lg bg-primary text-on-primary flex items-center justify-center font-bold text-[14px] shadow-sm shrink-0"
          >
            TD
          </div>
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-1.5">
              <span
                class="font-bold text-[15px] text-on-surface truncate leading-tight"
                id="top-store-name"
                >Toko Dani</span
              >
              <span
                class="px-1.5 py-0.5 rounded-full bg-primary-container text-on-primary font-semibold text-[10.5px] shrink-0 leading-none"
                >Buka</span
              >
            </div>
            <div
              class="flex items-center gap-1.5 text-on-surface-variant text-[12px] leading-tight mt-0.5"
            >
              <span class="truncate" id="top-date-label">Memuat...</span>
              <span class="text-outline/60">•</span>
              <span class="font-bold text-primary truncate" id="top-page-title"
                >Kasir</span
              >
            </div>
          </div>
        </div>

        <!-- DESKTOP TOP NAVIGATION (Hanya tampil di layar Komputer & Tablet) -->
        <nav
          id="desktop-nav"
          class="hidden md:flex items-center gap-1 bg-surface-sand/80 p-1 rounded-full border border-border-warm-subtle shadow-xs"
        >
          <button
            type="button"
            class="desktop-nav-item active px-3.5 py-1.5 rounded-full text-[12.5px] font-bold bg-primary text-on-primary shadow-xs flex items-center gap-1.5 transition-all cursor-pointer"
            data-path="kasir"
            onclick="window.pindahHalaman('kasir')"
          >
            <span class="material-symbols-outlined text-[17px]"
              >point_of_sale</span
            >
            <span>Kasir</span>
          </button>
          <button
            type="button"
            class="desktop-nav-item px-3.5 py-1.5 rounded-full text-[12.5px] font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-sand/80 flex items-center gap-1.5 transition-all cursor-pointer"
            data-path="tambah-barang"
            onclick="window.pindahHalaman('tambah-barang')"
          >
            <span class="material-symbols-outlined text-[17px]"
              >add_circle</span
            >
            <span>Tambah Barang</span>
          </button>
          <button
            type="button"
            class="desktop-nav-item px-3.5 py-1.5 rounded-full text-[12.5px] font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-sand/80 flex items-center gap-1.5 transition-all cursor-pointer"
            data-path="stok-barang"
            onclick="window.pindahHalaman('stok-barang')"
          >
            <span class="material-symbols-outlined text-[17px]"
              >inventory_2</span
            >
            <span>Stok Barang</span>
          </button>
          <button
            type="button"
            class="desktop-nav-item px-3.5 py-1.5 rounded-full text-[12.5px] font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-sand/80 flex items-center gap-1.5 transition-all cursor-pointer"
            data-path="keuangan"
            onclick="window.pindahHalaman('keuangan')"
          >
            <span class="material-symbols-outlined text-[17px]"
              >account_balance_wallet</span
            >
            <span>Keuangan</span>
          </button>
        </nav>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <!-- Indikator Koneksi Online/Offline & Tombol Sinkronisasi -->
          <button
            type="button"
            id="network-status-badge"
            onclick="window.bukaModalAntreanOffline()"
            class="px-2 py-1 rounded-full text-[11px] font-bold flex items-center gap-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 transition-colors cursor-pointer shadow-2xs"
            title="Status Jaringan: Online"
          >
            <span
              class="inline-block w-2 h-2 rounded-full bg-emerald-500 transition-colors"
              id="connection-dot"
            ></span>
            <span id="connection-text" class="hidden sm:inline">Online</span>
            <span
              id="offline-pending-badge"
              class="hidden px-1.5 py-0.2 rounded-full bg-amber-500 text-white text-[10px] font-extrabold animate-pulse"
              title="Transaksi belum disinkronkan"
              >0</span
            >
          </button>

          <!-- Tombol Install PWA (Otomatis tampil jika browser mendukung) -->
          <button
            type="button"
            id="btn-install-pwa"
            onclick="window.installAplikasiPWA()"
            class="hidden px-2.5 py-1 rounded-full bg-primary text-on-primary text-[11.5px] font-bold items-center gap-1 shadow-xs hover:opacity-95 active:scale-95 transition-all cursor-pointer"
            title="Install Toko Dani sebagai Aplikasi"
          >
            <span class="material-symbols-outlined text-[15px]">download</span>
            <span class="hidden md:inline">Install</span>
          </button>

          <button
            type="button"
            class="w-8 h-8 rounded-full bg-surface-sand border border-border-warm-subtle flex items-center justify-center text-text-primary-ink shadow-2xs hover:bg-surface-container-warm active:scale-95 transition-transform cursor-pointer"
            onclick="window.bukaPengaturanToko()"
            title="Pengaturan Toko"
          >
            <span class="material-symbols-outlined text-[17px]">settings</span>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN APP CONTAINER (Responsif: Spacing Header Pas & Max-w-7xl) -->
    <main
      class="flex flex-col relative w-full pt-[78px] md:pt-[86px] pb-24 md:pb-10 px-margin-mobile md:px-6 max-w-7xl mx-auto min-h-screen"
      id="app"
    >
      <!-- Active Tab content is rendered here by app.js -->
      <div
        class="flex flex-col items-center justify-center py-20 text-text-muted-ink gap-2.5"
      >
        <span
          class="material-symbols-outlined text-primary text-[36px] animate-spin"
          >progress_activity</span
        >
        <p class="font-medium text-[13.5px]">Menyiapkan Toko Dani...</p>
      </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR (Khusus Mobile: md:hidden agar layar komputer bersih) -->
    <nav
      class="md:hidden fixed bottom-0 w-full z-40 pb-safe bg-surface/94 backdrop-blur-xl border-t border-border-warm-subtle/80 shadow-[0_-2px_10px_rgba(41,37,36,0.03)]"
      id="bottom-nav"
    >
      <div class="flex justify-around items-center h-16 px-1">
        <a
          class="nav-tab-item active flex flex-col items-center justify-center flex-1 py-1 cursor-pointer"
          data-path="kasir"
          onclick="window.pindahHalaman('kasir')"
        >
          <div class="nav-icon-box">
            <span class="material-symbols-outlined text-[23px]"
              >point_of_sale</span
            >
          </div>
          <span class="nav-label">Kasir</span>
        </a>
        <a
          class="nav-tab-item flex flex-col items-center justify-center flex-1 py-1 cursor-pointer"
          data-path="tambah-barang"
          onclick="window.pindahHalaman('tambah-barang')"
        >
          <div class="nav-icon-box">
            <span class="material-symbols-outlined text-[23px]"
              >add_circle</span
            >
          </div>
          <span class="nav-label">Tambah</span>
        </a>
        <a
          class="nav-tab-item flex flex-col items-center justify-center flex-1 py-1 cursor-pointer"
          data-path="stok-barang"
          onclick="window.pindahHalaman('stok-barang')"
        >
          <div class="nav-icon-box">
            <span class="material-symbols-outlined text-[23px]"
              >inventory_2</span
            >
          </div>
          <span class="nav-label">Stok</span>
        </a>
        <a
          class="nav-tab-item flex flex-col items-center justify-center flex-1 py-1 cursor-pointer"
          data-path="keuangan"
          onclick="window.pindahHalaman('keuangan')"
        >
          <div class="nav-icon-box">
            <span class="material-symbols-outlined text-[23px]"
              >account_balance_wallet</span
            >
          </div>
          <span class="nav-label">Keuangan</span>
        </a>
      </div>
    </nav>

    <!-- MODALS CONTAINER -->
    <div id="modal-root"></div>

    <!-- TOAST NOTIFICATION -->
    <div
      class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-full text-[13px] font-semibold shadow-xl flex items-center gap-2 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2"
      id="toast"
    >
      <span
        class="material-symbols-outlined text-primary-fixed text-[20px]"
        id="toast-icon"
        >check_circle</span
      >
      <span id="toast-msg">Notifikasi Toko</span>
    </div>

    <!-- PRINT ROOT -->
    <div id="print-root" class="hidden"></div>

    <script type="module" src="app.js?v=20261115-10"></script>
  </body>
</html>
